# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: wormswmd
builds:
  - id: wormswmd
    main: .
    binary: wormswmd
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/openbunny/wormswmd/cmd.buildVersion=v{{ .Version }}
    mod_timestamp: '{{ .CommitTimestamp }}'
archives:
  - id: wormswmd
    formats: [tar.gz]
    name_template: wormswmd_{{ .Version }}_darwin_{{ .Arch }}
    files:
      - LICENSE
      - NOTICE
      - LICENSES/*
checksum:
  name_template: checksums.txt
sboms:
  - artifacts: archive
    cmd: syft
    documents: ['${artifact}.cdx.json']
    args: ['${artifact}', '--output', 'cyclonedx-json=$document']
signs:
  - cmd: cosign
    artifacts: checksum
    signature: '${artifact}.bundle'
    args: ['sign-blob', '--yes', '--bundle=${signature}', '${artifact}']
homebrew_casks:
  - name: wormswmd
    homepage: https://github.com/openbunny/wormswmd
    description: Patches Worms W.M.D so the game opens again
    license: MIT
    directory: Casks
    commit_author:
      name: Robot
      email: bot@fiona.sm
    repository:
      owner: OA
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    skip_upload: '{{ if .Env.HOMEBREW_TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'
    binaries: [wormswmd]
    custom_block: |
      depends_on arch: :arm64
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/wormswmd"]
          end
release:
  github:
    owner: openbunny
    name: wormswmd
