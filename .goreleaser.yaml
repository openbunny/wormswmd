# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: wormswmd
builds:
  - id: wormswmd
    main: .
    binary: wormswmd
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/openbunny/wormswmd/cmd.buildVersion=v{{ .Version }}
    mod_timestamp: '{{ .CommitTimestamp }}'
archives:
  - id: wormswmd
    formats: [tar.gz]
    name_template: wormswmd_{{ .Version }}_darwin_{{ .Arch }}
    files:
      - LICENSE
      - NOTICE
      - LICENSES/*
checksum:
  name_template: checksums.txt
sboms:
  - artifacts: archive
    cmd: syft
    documents: ['${artifact}.cdx.json']
    args: ['${artifact}', '--output', 'cyclonedx-json=$document']
signs:
  - cmd: cosign
    artifacts: checksum
    signature: '${artifact}.bundle'
    args: ['sign-blob', '--yes', '--bundle=${signature}', '${artifact}']
release:
  github:
    owner: openbunny
    name: wormswmd
