name: Fuzz
on:
  pull_request:
  schedule:
    - cron: '0 3 * * 0'
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fuzz:
    name: Fuzz
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    env:
      FUZZ_TIME: 60s
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./internal/backup, name: FuzzParseMetadata }
          - { pkg: ./internal/backup, name: FuzzManifest }
          - { pkg: ./internal/configurl, name: FuzzRewrite }
          - { pkg: ./internal/game, name: FuzzLibraryPaths }
          - { pkg: ./internal/macho, name: FuzzParseDeps }
          - { pkg: ./internal/plistfix, name: FuzzFix }
          - { pkg: ./internal/qt, name: FuzzExtract }
          - { pkg: ./internal/safe, name: FuzzCleanRel }
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: ${{ matrix.target.name }}
        env:
          FUZZ_TARGET: ${{ matrix.target.name }}
          FUZZ_PKG: ${{ matrix.target.pkg }}
        run: go test -run '^$' -fuzz="^${FUZZ_TARGET}\$" -fuzztime="${FUZZ_TIME}" "${FUZZ_PKG}"
