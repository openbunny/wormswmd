# yaml-language-server: $schema=https://json.schemastore.org/github-issue-forms.json
name: Feature request
description: Suggest a command, flag, or behaviour
title: "[feature]: "
labels: ["type/feature", "status/needs-triage"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: The part of wormswmd the request affects.
      options:
        - "apply, preview, restore"
        - "Qt fetch and framework replacement"
        - "Mach-O and Info.plist rewriting"
        - "saves backup and restore"
        - "check and launch"
        - "support report"
        - "Build, toolchain, or install"
        - New component
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The task that is hard or impossible.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behaviour you want and how it would be invoked.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk
      description: "What the change could break in the app bundle: install names, `Info.plist` keys, the code signature, the quarantine attribute, or saved games."
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered.
    validations:
      required: false
